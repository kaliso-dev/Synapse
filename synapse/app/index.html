<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
<title>{{TITRE}} · Synapse</title>
<link rel="icon" href="icon.svg?v={{VERSION}}" type="image/svg+xml">
<link rel="stylesheet" href="synapse.css?v={{VERSION}}">
<script src="synapse.js?v={{VERSION}}" defer></script>
</head>
<body class="cv">
<div class="cv-app" id="cv" data-src="data.json">
  <input type="checkbox" id="cv-nav" class="cv-nav-t" tabindex="-1" aria-hidden="true">
  <aside class="cv-side" aria-label="Explorateur">
    <div class="cv-brand">
      <a class="cv-logo" href="./" title="Revenir au graphe"><svg class="cv-mark" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"><path d="M6 7l6 10M6 7l12-2M18 5l-6 12M12 17l7-1M18 5l1 11"/></g><circle cx="6" cy="7" r="2.6" class="a"/><circle cx="18" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="17" r="3" fill="currentColor"/><circle cx="19" cy="16" r="1.6" fill="currentColor"/></svg><span><b>{{TITRE}}</b><small>Synapse</small></span></a>
      <label class="cv-ibtn cv-side-close" for="cv-nav" aria-label="Fermer le panneau"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
    </div>
    <button class="cv-searchbtn" type="button" data-palette><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM10.6 10.6l3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Rechercher une note ou un fichier</span><kbd>Ctrl K</kbd></button>
    <label class="cv-filter"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h6M12 4.5h1M3 11.5h1M7 11.5h6M10.5 3v3M5.5 10v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><input id="cv-filter" type="search" placeholder="Filtrer le graphe" autocomplete="off" spellcheck="false" aria-label="Filtrer le graphe"></label>
    <div class="cv-tabs" role="tablist">
      <button type="button" role="tab" id="tab-files" aria-controls="panel-files" aria-selected="true"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4a1 1 0 0 1 1-1h3l1.5 1.5h4.5a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Fichiers</button>
      <button type="button" role="tab" id="tab-view" aria-controls="panel-view" aria-selected="false"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h6M12 4.5h1M3 11.5h1M7 11.5h6M10.5 3v3M5.5 10v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Affichage</button>
    </div>
    <div class="cv-panels">
      <section class="cv-panel" id="panel-files" role="tabpanel" aria-labelledby="tab-files"></section>
      <section class="cv-panel" id="panel-view" role="tabpanel" aria-labelledby="tab-view" hidden></section>
    </div>
    <footer class="cv-foot"><div class="cv-sync" id="cv-sync" aria-live="polite">Lecture du vault…</div>
      <button class="cv-ibtn" type="button" id="cv-refresh" aria-label="Relire le vault" title="Relire le vault"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></footer>
  </aside>
  <label class="cv-scrim" for="cv-nav" aria-hidden="true"></label>
  <main class="cv-stage" id="cv-stage">
    <canvas id="cv-canvas" role="img" aria-label="Graphe des notes du vault et de leurs liens"></canvas>
    <div class="cv-hud cv-hud-l">
      <label class="cv-ibtn cv-menu" for="cv-nav" aria-label="Ouvrir l’explorateur" role="button" tabindex="0"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
      <div class="cv-stats" id="cv-stats"></div>
    </div>
    <div class="cv-hud cv-hud-r" role="toolbar" aria-label="Graphe">
      <div class="cv-seg" id="cv-local" hidden><button type="button" class="cv-ibtn" data-local aria-pressed="false" title="Graphe local : seulement les voisins de la note ouverte (L)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM3 4.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM13 4.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM3 13.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM13 13.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM6.8 7L3.7 4.2M9.2 7l3.1-2.8M6.8 9l-3.1 2.8M9.2 9l3.1 2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Local</span></button>
        <button type="button" class="cv-depth" data-depth aria-label="Profondeur du graphe local" title="Profondeur">1</button></div>
      <button type="button" class="cv-ibtn" data-zoom="in" aria-label="Zoomer"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="cv-ibtn" data-zoom="out" aria-label="Dézoomer"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="cv-ibtn" data-fit aria-label="Tout voir (F)" title="Tout voir (F)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V3.5a1 1 0 0 1 1-1H6M10 2.5h2.5a1 1 0 0 1 1 1V6M13.5 10v2.5a1 1 0 0 1-1 1H10M6 13.5H3.5a1 1 0 0 1-1-1V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="cv-ibtn cv-search-m" data-palette aria-label="Rechercher"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM10.6 10.6l3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="cv-tip" id="cv-tip" role="tooltip" hidden></div>
    <div class="cv-loading" id="cv-loading" role="status"><div class="cv-pulse"><svg class="cv-mark" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"><path d="M6 7l6 10M6 7l12-2M18 5l-6 12M12 17l7-1M18 5l1 11"/></g><circle cx="6" cy="7" r="2.6" class="a"/><circle cx="18" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="17" r="3" fill="currentColor"/><circle cx="19" cy="16" r="1.6" fill="currentColor"/></svg></div><p>Lecture du vault…</p><small></small></div>
    <p class="cv-hint" id="cv-hint" hidden>Clique sur un point pour lire la note · glisse pour déplacer · molette pour zoomer</p>
  </main>
  <section class="cv-reader" id="cv-reader" aria-label="Lecteur" hidden>
    <div class="cv-resize" id="cv-resize" role="separator" aria-orientation="vertical" aria-label="Largeur du lecteur" tabindex="0"></div>
    <header class="cv-rbar">
      <button type="button" class="cv-ibtn" data-hist="back" aria-label="Précédent"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="cv-crumbs" id="cv-crumbs"></div>
      <div class="cv-ractions" id="cv-ractions"></div>
      <button type="button" class="cv-ibtn" data-close aria-label="Fermer le lecteur (Échap)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </header>
    <div class="cv-scroll" id="cv-scroll"><article class="cv-doc" id="cv-doc"></article></div>
  </section>
  <div class="cv-palette" id="cv-palette" hidden>
    <div class="cv-pal" role="dialog" aria-modal="true" aria-label="Rechercher">
      <label class="cv-pal-in"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM10.6 10.6l3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><input id="cv-q" type="search" placeholder="Une note, un mot, un fichier…" autocomplete="off" spellcheck="false" aria-label="Rechercher" aria-controls="cv-results"></label>
      <ul class="cv-results" id="cv-results" role="listbox"></ul>
      <p class="cv-pal-foot"><kbd>↑</kbd><kbd>↓</kbd> choisir · <kbd>Entrée</kbd> ouvrir · <kbd>Échap</kbd> fermer</p>
    </div>
  </div>
</div>
<noscript><p class="cv-noscript">Synapse a besoin de JavaScript pour dessiner le graphe.</p></noscript>
</body>
</html>
